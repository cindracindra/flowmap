<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">FlowMap quick-start guide</title>
  <desc id="desc">A one-page guide showing the topic-first and code-first workflows for exploring operation control flow in FlowMap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b0d"/>
      <stop offset="1" stop-color="#111518"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#b98116"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#657079"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .muted{fill:#9ba5ad}.body{fill:#d7dde1}.white{fill:#f5f7f8}.gold{fill:#f3bd43}
      .card{fill:#151a1e;stroke:#2a3136;stroke-width:1.5}.mini{fill:#0c1012;stroke:#333b41;stroke-width:1.2}
      .step{fill:url(#gold)}.label{font-size:18px;font-weight:700;letter-spacing:.02em}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1475" cy="-20" r="300" fill="#d69a1c" opacity=".055"/>
  <circle cx="80" cy="1010" r="330" fill="#20a58f" opacity=".045"/>

  <!-- Header -->
  <g class="sans">
    <rect x="68" y="54" width="44" height="44" rx="10" fill="#2a2110" stroke="#76571b"/>
    <path d="M81 70h8m0 0v17m0-9h10m0 0v9" fill="none" stroke="#f3bd43" stroke-width="3" stroke-linecap="round"/>
    <circle cx="81" cy="70" r="3" fill="#f3bd43"/><circle cx="89" cy="87" r="3" fill="#f3bd43"/><circle cx="99" cy="87" r="3" fill="#f3bd43"/>
    <text x="130" y="79" class="white" font-size="23" font-weight="750">FlowMap</text>
    <text x="68" y="145" class="white" font-size="54" font-weight="780">Quick start</text>
    <text x="68" y="184" class="muted" font-size="21">Move from a codebase question to an explainable operation graph.</text>
    <rect x="1198" y="78" width="330" height="78" rx="16" fill="#151a1e" stroke="#2a3136"/>
    <text x="1224" y="108" class="muted" font-size="14" font-weight="700" letter-spacing=".12em">CORE IDEA</text>
    <text x="1224" y="137" class="body" font-size="17">Topic → operation → control flow</text>
  </g>

  <!-- Primary workflow -->
  <g class="sans" filter="url(#shadow)">
    <rect x="68" y="228" width="1460" height="418" rx="24" class="card"/>
    <text x="102" y="270" class="gold" font-size="14" font-weight="800" letter-spacing=".14em">RECOMMENDED WORKFLOW</text>
    <text x="102" y="305" class="white" font-size="28" font-weight="730">Start with what the system does</text>

    <!-- Step 1 -->
    <g transform="translate(102 338)">
      <circle cx="25" cy="25" r="25" class="step"/><text x="25" y="32" text-anchor="middle" fill="#171208" font-size="20" font-weight="850">1</text>
      <text x="0" y="83" class="white label">Open Topic discovery</text>
      <text x="0" y="110" class="muted" font-size="16">Use the top navigation to see</text>
      <text x="0" y="133" class="muted" font-size="16">semantic clusters of operations.</text>
      <rect x="0" y="158" width="286" height="78" rx="12" class="mini"/>
      <circle cx="22" cy="181" r="7" fill="none" stroke="#f3bd43" stroke-width="2"/>
      <path d="M18 181h8M22 177v8" stroke="#f3bd43" stroke-width="1.5"/>
      <text x="40" y="187" class="body" font-size="16" font-weight="650">Topic discovery</text>
      <rect x="14" y="204" width="256" height="3" rx="2" fill="#d89b1d"/>
    </g>
    <path d="M410 474 H478" stroke="#657079" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <g transform="translate(500 338)">
      <circle cx="25" cy="25" r="25" class="step"/><text x="25" y="32" text-anchor="middle" fill="#171208" font-size="20" font-weight="850">2</text>
      <text x="0" y="83" class="white label">Choose a topic</text>
      <text x="0" y="110" class="muted" font-size="16">Pick the capability area that best</text>
      <text x="0" y="133" class="muted" font-size="16">matches your investigation.</text>
      <rect x="0" y="158" width="286" height="78" rx="12" class="mini"/>
      <path d="M18 177l8-5 8 5-8 5zM18 184l8 5 8-5" fill="none" stroke="#f3bd43" stroke-width="1.8"/>
      <text x="45" y="181" class="body" font-size="15" font-weight="650">Shopping Cart Management</text>
      <text x="45" y="207" class="muted mono" font-size="13">10 assigned operations</text>
    </g>
    <path d="M808 474 H876" stroke="#657079" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <g transform="translate(898 338)">
      <circle cx="25" cy="25" r="25" class="step"/><text x="25" y="32" text-anchor="middle" fill="#171208" font-size="20" font-weight="850">3</text>
      <text x="0" y="83" class="white label">Open an operation</text>
      <text x="0" y="110" class="muted" font-size="16">Select the user-visible action you</text>
      <text x="0" y="133" class="muted" font-size="16">want to trace through the code.</text>
      <rect x="0" y="158" width="286" height="78" rx="12" class="mini"/>
      <path d="M19 177h10v10h10" fill="none" stroke="#f3bd43" stroke-width="2"/>
      <circle cx="19" cy="177" r="3" fill="#f3bd43"/><circle cx="29" cy="187" r="3" fill="#f3bd43"/><circle cx="39" cy="187" r="3" fill="#f3bd43"/>
      <text x="51" y="183" class="body" font-size="16" font-weight="650">Add Item to Cart</text>
      <text x="51" y="209" class="muted mono" font-size="13">operation graph</text>
    </g>
    <path d="M1206 474 H1274" stroke="#657079" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <g transform="translate(1296 338)">
      <circle cx="25" cy="25" r="25" class="step"/><text x="25" y="32" text-anchor="middle" fill="#171208" font-size="20" font-weight="850">4</text>
      <text x="0" y="83" class="white label">Read the graph</text>
      <text x="0" y="110" class="muted" font-size="16">Follow calls, branches and phases;</text>
      <text x="0" y="133" class="muted" font-size="16">select nodes for local context.</text>
      <rect x="0" y="158" width="198" height="78" rx="12" class="mini"/>
      <circle cx="25" cy="181" r="7" fill="#132b2c" stroke="#57a6a8" stroke-width="2"/>
      <path d="M32 181h48M80 181l-8-6m8 6l-8 6" stroke="#657f81" stroke-width="2"/>
      <rect x="87" y="170" width="91" height="23" rx="7" fill="#20262a" stroke="#4a555d"/>
      <text x="132" y="186" text-anchor="middle" class="body mono" font-size="11">method call</text>
    </g>
  </g>

  <!-- Lower cards -->
  <g class="sans" filter="url(#shadow)">
    <rect x="68" y="676" width="695" height="256" rx="22" class="card"/>
    <text x="102" y="718" class="gold" font-size="14" font-weight="800" letter-spacing=".14em">CODE-FIRST SHORTCUT</text>
    <text x="102" y="754" class="white" font-size="25" font-weight="730">Already know the method?</text>
    <rect x="102" y="782" width="627" height="54" rx="12" class="mini"/>
    <text x="125" y="816" class="muted" font-size="17">⌕</text>
    <text x="156" y="816" class="muted" font-size="16">Search project files and methods…</text>
    <g transform="translate(102 861)">
      <circle cx="10" cy="10" r="10" fill="#2b2414"/><text x="10" y="15" text-anchor="middle" class="gold" font-size="13" font-weight="800">1</text>
      <text x="31" y="16" class="body" font-size="16">Open <tspan font-weight="700">Anchored graph</tspan></text>
      <circle cx="235" cy="10" r="10" fill="#2b2414"/><text x="235" y="15" text-anchor="middle" class="gold" font-size="13" font-weight="800">2</text>
      <text x="256" y="16" class="body" font-size="16">Search and select a method</text>
      <circle cx="492" cy="10" r="10" fill="#2b2414"/><text x="492" y="15" text-anchor="middle" class="gold" font-size="13" font-weight="800">3</text>
      <text x="513" y="16" class="body" font-size="16">Choose context if asked</text>
    </g>
  </g>

  <g class="sans" filter="url(#shadow)">
    <rect x="793" y="676" width="735" height="256" rx="22" class="card"/>
    <text x="827" y="718" class="gold" font-size="14" font-weight="800" letter-spacing=".14em">GRAPH TOOLKIT</text>
    <text x="827" y="754" class="white" font-size="25" font-weight="730">Orient yourself quickly</text>
    <g transform="translate(827 786)">
      <rect width="205" height="52" rx="11" class="mini"/><text x="18" y="23" class="body" font-size="15" font-weight="700">Branches / phases</text><text x="18" y="42" class="muted" font-size="13">Switch the overlay</text>
      <rect x="221" width="205" height="52" rx="11" class="mini"/><text x="239" y="23" class="body" font-size="15" font-weight="700">Explore / Operation</text><text x="239" y="42" class="muted" font-size="13">Change the left panel</text>
      <rect x="442" width="225" height="52" rx="11" class="mini"/><text x="460" y="23" class="body" font-size="15" font-weight="700">Zoom / reset</text><text x="460" y="42" class="muted" font-size="13">Navigate the canvas</text>
      <rect y="68" width="205" height="52" rx="11" class="mini"/><text x="18" y="91" class="body" font-size="15" font-weight="700">Select a node</text><text x="18" y="110" class="muted" font-size="13">Inspect its context</text>
      <rect x="221" y="68" width="205" height="52" rx="11" class="mini"/><text x="239" y="91" class="body" font-size="15" font-weight="700">Legend</text><text x="239" y="110" class="muted" font-size="13">Decode nodes and edges</text>
      <rect x="442" y="68" width="225" height="52" rx="11" class="mini"/><text x="460" y="91" class="body" font-size="15" font-weight="700">Status bar</text><text x="460" y="110" class="muted" font-size="13">Check graph scope and counts</text>
    </g>
  </g>

  <g class="sans">
    <text x="68" y="970" class="muted" font-size="14">Tip: start broad with topics; switch to code-first search when you already know the class or method.</text>
    <text x="1528" y="970" text-anchor="end" class="muted mono" font-size="13">FlowMap · one-page guide</text>
  </g>
</svg>
